const BODY_SKELETON="\n<div class=\"panel\"><h3 id=\"ttl\">🚌 Routes</h3>\n <div id=\"dir\"></div>\n <div style=\"margin-top:6px\">Kid names/addresses from CSV:<br><input type=\"file\" id=\"file\" accept=\".csv\"></div>\n <div id=\"status\" style=\"margin-top:4px;color:#666\">Load the matching CSV to show kid names &amp; addresses.</div>\n <button id=\"export\">⬇ Export HTML (bake kid data)</button>\n</div>\n<div class=\"legend\"><h3 id=\"legttl\">Buses</h3>\n <div class=\"ctl\"><button id=\"allOn\">All on</button><button id=\"allOff\">All off</button></div>\n <div id=\"rows\"></div>\n <div style=\"margin-top:8px;font-size:11px;color:#666\">● stop (#·time) &nbsp; ▪ home</div>\n</div>";
</script><script id="render">
document.getElementById('ui').innerHTML = BODY_SKELETON;
let kidInfo = Object.assign({}, window.BAKED||{});
const map=L.map('map'); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
document.getElementById('ttl').textContent = RET?'🏠 From school (return)':'🏫 To school (pickup)';

L.marker([DATA.school.lat,DATA.school.lon],{icon:L.divIcon({className:'',html:'<div style="background:#111;color:#fff;border:2px solid #fff;border-radius:4px;padding:2px 5px;font-size:12px;font-weight:bold">🏫 School</div>',iconSize:[70,20],iconAnchor:[35,10]}),zIndexOffset:1000}).addTo(map).bindTooltip('<b>'+DATA.school.address+'</b>',{sticky:true});
const bounds=[[DATA.school.lat,DATA.school.lon]]; const layers={}; const ttips=[];
function kidLabel(num){const i=kidInfo[num]; return i?`${i.name} (#${num})`:`#${num}`;}
function kidAddr(num){const i=kidInfo[num]; if(!i)return ''; return (i.he1||'')+(i.he2? ' / '+i.he2:'');}
DATA.buses.forEach(b=>{
 const g=L.layerGroup();
 L.polyline(b.geometry,{color:b.color,weight:4,opacity:.85}).addTo(g); b.geometry.forEach(c=>bounds.push(c));
 b.homes.forEach(h=>{ const st=b.stations.find(s=>s.no===h.station_no);
   if(st) L.polyline([[h.lat,h.lon],[st.lat,st.lon]],{color:'#555',weight:1,dashArray:'3,4',opacity:.6}).addTo(g);
   const m=L.marker([h.lat,h.lon],{icon:L.divIcon({className:'',html:`<div style="background:${b.color};width:10px;height:10px;border:1.5px solid #fff"></div>`,iconSize:[10,10],iconAnchor:[5,5]})}).addTo(g);

 });
 b.stations.forEach(s=>{

   m.bindTooltip('',{sticky:true,maxWidth:300});

 });
 g.addTo(map); layers[b.bus]={group:g,on:true};
});
map.fitBounds(bounds,{padding:[30,30]});
function refresh(){ttips.forEach(f=>f());}

const rowsEl=document.getElementById('rows');

 row.onclick=()=>{const L0=layers[b.bus];L0.on=!L0.on;if(L0.on)L0.group.addTo(map);else map.removeLayer(L0.group);row.classList.toggle('off',!L0.on);};
 rowsEl.appendChild(row);});
document.getElementById('allOn').onclick=()=>{Object.values(layers).forEach(l=>{l.on=true;l.group.addTo(map)});document.querySelectorAll('.row').forEach(r=>r.classList.remove('off'));};
document.getElementById('allOff').onclick=()=>{Object.values(layers).forEach(l=>{l.on=false;map.removeLayer(l.group)});document.querySelectorAll('.row').forEach(r=>r.classList.add('off'));};
// CSV loader -> kid name/address by number
function splitLine(line){const o=[];let c='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch=='"'&&line[i+1]=='"'){c+='"';i++;}else if(ch=='"')q=false;else c+=ch;}else{if(ch=='"')q=true;else if(ch==','){o.push(c);c='';}else c+=ch;}}o.push(c);return o.map(s=>s.trim());}
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{const lines=rd.result.replace(/^﻿/,'').split(/\r?\n/).filter(x=>x);const h=splitLine(lines[0]);
   const idx={};h.forEach((x,i)=>idx[x]=i);let n=0;
   lines.slice(1).forEach(l=>{const c=splitLine(l);const num=c[idx['kid_num']];if(!num)return;
     kidInfo[num]={name:c[idx['kid_name']]||'',he1:c[idx['home_address_hebrew']]||'',he2:c[idx['home_address_hebrew_2']]||''};n++;});
   document.getElementById('status').textContent=`Loaded ${n} kids from ${f.name}`; refresh();};
 rd.readAsText(f);};
// Export a standalone HTML with the currently-loaded kid data baked in
document.getElementById('export').onclick=()=>{
 if(!Object.keys(kidInfo).length && !confirm('No CSV loaded — export without kid names? (stops will show kid numbers only)')) return;
 const css=document.getElementById('css').outerHTML;
 const render=document.getElementById('render').textContent;
 const data='<script id="data">\nconst DATA='+JSON.stringify(DATA)+';\nconst RET=DATA.return_route;\nwindow.BAKED='+JSON.stringify(kidInfo)+';\nconst BODY_SKELETON='+JSON.stringify(BODY_SKELETON)+';\n<\/script>';
 const head='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bus Routes<\/title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>'+css;
 const html='<!DOCTYPE html><html lang="en"><head>'+head+'</head><body><div id="map"></div><div id="ui"></div>'+data+'<script id="render">'+render+'<\/script></body></html>';
 const blob=new Blob([html],{type:'text/html'});const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download=(RET?'return':'pickup')+'_routes_baked.html';a.click();
};
</script></body></html>
