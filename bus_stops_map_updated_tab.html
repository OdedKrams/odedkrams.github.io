const ROUTE_COLORS = {
  "1": "#e74c3c", "2": "#2980b9", "3": "#27ae60",
  "4": "#d35400", "5": "#8e44ad", "6": "#16a085",
  "7": "#e84393", "8": "#7f8c8d"
};

function initMap() {
  const mapContainer = document.getElementById('map');
  if (!mapContainer) return;

  const map = L.map('map', { zoomControl: true }).setView([32.08, 34.79], 12);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // יעד
  L.marker([32.0522, 34.7699], {
    icon: L.divIcon({
      html: '<div style="background:#2563eb;color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;white-space:nowrap;border:2px solid #fff;">🏫 יעד - בית ספר לטבע</div>',
      className: '',
      iconSize: null
    })
  }).addTo(map);

  const routeGroups = {};
  const bounds = [];

  STOPS.forEach(stop => {
    const color = ROUTE_COLORS[stop.route_num] || "#64748b";
    const icon = L.divIcon({
      className: '',
      html: `<div class="stop-badge" style="width:28px;height:28px;background:${color};color:#fff;">${stop.stop_num}</div>`,
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });

    const marker = L.marker([stop.lat, stop.lng], { icon });
    const kidsList = stop.children.map(name => `<li>${name}</li>`).join('');
    const tooltipHtml = `
      <div class="tip-title">${stop.station_name}</div>
      <div class="tip-meta">קו <b>${stop.route_num}</b> (${stop.vehicle}) &nbsp;•&nbsp; תחנה מס' <b>${stop.stop_num}</b> &nbsp;•&nbsp; איסוף <b>${stop.arrival}</b></div>
      <div class="tip-meta">${stop.address}</div>
      <div style="font-weight:700;margin-top:4px;">ילדים בתחנה:</div>
      <ul class="tip-kids">${kidsList}</ul>
    `;

    marker.bindTooltip(tooltipHtml, {
      className: 'stop-tip',
      direction: 'top',
      offset: [0, -14],
      opacity: 1
    });

    if (!routeGroups[stop.route_num]) routeGroups[stop.route_num] = L.layerGroup();
    routeGroups[stop.route_num].addLayer(marker);
    bounds.push([stop.lat, stop.lng]);
  });

  Object.values(routeGroups).forEach(g => g.addTo(map));
  if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });

  // Legend
  const legendEl = document.getElementById('legend');
  Object.keys(routeGroups).sort((a,b) => parseInt(a) - parseInt(b)).forEach(routeNum => {
    const color = ROUTE_COLORS[routeNum] || "#ccc";
    const chip = document.createElement('div');
    chip.className = 'legend-chip';
    chip.innerHTML = `<span class="legend-dot" style="background:${color}"></span> קו ${routeNum}`;
    chip.addEventListener('click', () => {
      const group = routeGroups[routeNum];
      if (map.hasLayer(group)) {
        map.removeLayer(group);
        chip.classList.add('dim');
      } else {
        map.addLayer(group);
        chip.classList.remove('dim');
      }
    });
    legendEl.appendChild(chip);
  });

  setTimeout(() => { map.invalidateSize(); }, 300);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initMap);
} else {
  initMap();
}
</script>
